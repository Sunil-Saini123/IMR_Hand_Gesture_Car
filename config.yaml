# Shared configuration for the Webots controller, the gesture app and the evaluation tools.
network:
  host: "127.0.0.1"
  port: 5005
  timeout_seconds: 0.5            # watchdog: the robot stops if no packet arrives for this long
  status_period_seconds: 0.2      # controller -> sender status replies

robot:
  max_wheel_speed_rad_s: 6.28
  wheel_radius_m: 0.0205          # nominal e-puck value; the simulated wheel is 0.020 m (a realistic calibration error)
  wheel_base_m: 0.052
  body_radius_m: 0.037
  start_pose: [-1.5, -1.5, 0.0]   # x, y (m), yaw (rad); must match the E-puck pose in webots/worlds/gesture_arena.wbt
  proximity_stop_threshold: 200.0 # raw IR reading for the last-resort stop, about 3.5 cm per the PROTO lookup table

teleop:
  turn_fraction: 0.45             # LEFT/RIGHT spin rate as a fraction of the maximum

gesture:
  camera_index: 0
  width: 640
  height: 480
  stable_frames: 4                # a gesture is used once it fills this many of the last vote_window_frames,
  vote_window_frames: 7           # so a few misread frames neither start nor stop a command
  default_speed: 0.4
  classifier: auto                # auto (Random Forest if the model file exists), rules or rf
  model_path: models/gesture_rf.joblib
  min_confidence: 0.6             # Random Forest predictions below this become STOP
  key_hold_seconds: 0.6           # a key press keeps commanding for this long

lidar:
  name: lidar

mapping:
  resolution_m_per_cell: 0.05
  width_cells: 120
  height_cells: 120
  log_odds_hit: 0.85
  log_odds_miss: -0.4
  update_every_n_steps: 3

localization:
  update_every_n_steps: 4
  min_motion_m: 0.005                        # skip landmark corrections until the wheels moved this far
  initial_sigma: [0.01, 0.01, 0.02]          # x, y (m), theta (rad)
  motion_noise: [0.04, 0.005, 0.05, 0.3]     # a1..a4, see robot_core/ekf.py; turns slip by ~10-30%
  range_noise_m: 0.03
  bearing_noise_rad: 0.03
  gate_chi2: 9.21                            # 99% chi-square bound, 2 degrees of freedom
  relax_after_rejections: 10                 # updates with posts in view but none accepted ...
  relax_sigma: [0.05, 0.05, 0.15]            # ... then widen the covariance by this much
  lost_warning_seconds: 10.0
  landmark_radius_m: 0.05
  landmarks:                                 # post centres (m); must match the LANDMARK_* solids in the world
    - [-1.2, -0.5]
    - [1.3, 0.6]
    - [-1.2, 1.3]
    - [0.0, -1.3]

navigation:
  planner: astar                  # default planner: astar or potential_field
  occupied_threshold: 0.65
  inflation_m: 0.08
  replan_period_s: 1.0
  lookahead_m: 0.12
  goal_tolerance_m: 0.06
  max_linear: 0.08                # m/s
  max_angular: 1.2                # rad/s; faster turns make the wheels slip more
  heading_gain: 2.0
  rotate_in_place_rad: 0.8
  slow_radius_m: 0.15
  stop_distance_m: 0.07           # LiDAR range from the robot centre that stops forward motion
  slow_distance_m: 0.2
  timeout_s: 150.0
  stuck_window_s: 15.0
  stuck_min_progress_m: 0.05
  no_path_timeout_s: 5.0
  pf_influence_m: 0.3
  pf_repulsion_gain: 0.02

assisted:
  influence_radius_m: 0.25
  repulsion_gain: 0.01
  stop_distance_m: 0.07
  slow_distance_m: 0.2
  heading_gain: 2.0
  max_angular: 2.0

goals:                            # selectable in GOAL mode, in this order (keys 1-5)
  HOME: [-1.5, -1.5]
  A: [1.5, 1.5]
  B: [1.3, -0.35]
  C: [0.2, 1.6]
  D: [-1.5, 0.3]

trials:
  sequence: [B, C, D, HOME]       # legs driven by evaluation/run_trials.py, starting from HOME

logging:
  enabled: true
  directory: data
  flush_period_s: 1.0
  map_save_period_s: 10.0
